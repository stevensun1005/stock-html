<!doctype html>
<html lang="{{LANG}}" data-capmax="{{CAPMAX}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<style>
/* ============================================================
   stock-html 模板 —— 卡通手绘图解页
   两套主题：方格纸（浅色）/ 黑板粉笔（深色），全部用 CSS 变量。
   不加载任何外链资源：单文件、离线可开、Artifact CSP 友好。
   ============================================================ */
:root{
  --paper:#fbf7ec; --card:#fffdf5; --ink:#2a2a2e; --ink2:#62626b; --shadow:#2a2a2e;
  --green:#1f9652; --green-f:#d4f1dd;
  --orange:#e07a12; --orange-f:#ffe5c4;
  --blue:#2a70cf; --blue-f:#d6e7fb;
  --red:#d2402f; --red-f:#fddfda;
  --purple:#7a4bb5; --hl:#fff0a0;
  --bg-image:
    linear-gradient(rgba(70,110,170,.20) 1px,transparent 1px),
    linear-gradient(90deg,rgba(70,110,170,.20) 1px,transparent 1px),
    linear-gradient(rgba(70,110,170,.09) 1px,transparent 1px),
    linear-gradient(90deg,rgba(70,110,170,.09) 1px,transparent 1px);
  --bg-size:100px 100px,100px 100px,20px 20px,20px 20px;
  --hand:"Patrick Hand","Chalkboard SE","Comic Sans MS","Segoe Print","Ma Shan Zheng","HanziPen SC","Hannotate SC","Kaiti SC","STKaiti","KaiTi","楷体",cursive;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1f3b33; --card:#27483c; --ink:#f4f1e4; --ink2:#bccabb; --shadow:#0e211b;
    --green:#8fe3a8; --green-f:rgba(143,227,168,.20);
    --orange:#ffbb6e; --orange-f:rgba(255,187,110,.20);
    --blue:#9ccbff; --blue-f:rgba(156,203,255,.20);
    --red:#ff9a8f; --red-f:rgba(255,154,143,.18);
    --purple:#d9bcff; --hl:rgba(255,240,160,.22);
    --bg-image:
      radial-gradient(ellipse at 30% 0%,rgba(255,255,255,.07),transparent 60%),
      repeating-linear-gradient(115deg,rgba(255,255,255,.022) 0 2px,transparent 2px 9px);
    --bg-size:auto,auto;
  }
}
:root[data-theme="dark"]{
  --paper:#1f3b33; --card:#27483c; --ink:#f4f1e4; --ink2:#bccabb; --shadow:#0e211b;
  --green:#8fe3a8; --green-f:rgba(143,227,168,.20);
  --orange:#ffbb6e; --orange-f:rgba(255,187,110,.20);
  --blue:#9ccbff; --blue-f:rgba(156,203,255,.20);
  --red:#ff9a8f; --red-f:rgba(255,154,143,.18);
  --purple:#d9bcff; --hl:rgba(255,240,160,.22);
  --bg-image:
    radial-gradient(ellipse at 30% 0%,rgba(255,255,255,.07),transparent 60%),
    repeating-linear-gradient(115deg,rgba(255,255,255,.022) 0 2px,transparent 2px 9px);
  --bg-size:auto,auto;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; color:var(--ink); background-color:var(--paper);
  background-image:var(--bg-image); background-size:var(--bg-size);
  font:16px/1.75 var(--sans);
}
.page{max-width:880px; margin:0 auto; padding:26px 16px 72px; position:relative}
a{color:var(--blue); text-underline-offset:3px}
b,strong{font-weight:650}
mark{background:var(--hl); color:inherit; padding:0 .2em; border-radius:3px}
code{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.9em; background:var(--hl); padding:.05em .35em; border-radius:4px}

/* ---------- 页头 ---------- */
.hero{position:relative; padding:8px 0 6px}
.theme-btn{
  position:absolute; top:4px; right:0;  /* 不用 fixed：滚动时不会盖住印章 */
  font:15px var(--hand); color:var(--ink); background:var(--card); cursor:pointer;
  border:2px solid var(--ink); border-radius:14px 5px 12px 6px / 6px 12px 5px 14px;
  padding:4px 12px; box-shadow:3px 3px 0 var(--shadow);
}
.theme-btn:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--shadow)}
.kicker{
  display:inline-block; margin:0 0 6px; padding:1px 12px; font:15px var(--hand);
  border:2px solid var(--ink); border-radius:12px 4px 10px 5px / 5px 10px 4px 12px;
  background:var(--hl); transform:rotate(-1.2deg);
}
h1{font:700 clamp(28px,5.4vw,40px)/1.25 var(--hand); margin:6px 0 8px; padding-right:110px; letter-spacing:.01em}
h1 em{font-style:normal; background:linear-gradient(transparent 62%,var(--hl) 62%)}
.sub{margin:0 0 12px; font-size:17px; color:var(--ink2); max-width:40em}
.notice{
  margin:12px 0 0; padding:8px 14px; font-size:14.5px; background:var(--card);
  border:2px dashed var(--orange); border-radius:10px 4px 12px 5px / 5px 12px 4px 10px;
}
.legend{display:flex; flex-wrap:wrap; gap:6px 16px; margin:10px 0 0; padding:0; list-style:none; font-size:14px; color:var(--ink2)}
.legend li{display:flex; align-items:center; gap:6px}
.legend svg{width:26px; height:14px; flex:none}   /* 全局 svg{width:100%} 会撑大小图标，这里单独钉死 */

/* ---------- 小节 ---------- */
.sec{margin:38px 0 0}
h2{font:700 28px/1.3 var(--hand); margin:0 0 6px; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
h2 .no{
  flex:none; width:34px; height:34px; display:inline-grid; place-items:center; font-size:20px; align-self:center;
  border:2.5px solid var(--ink); border-radius:50% 46% 52% 44% / 46% 52% 44% 50%; background:var(--hl);
}
h2 small{font:15px var(--sans); color:var(--ink2); white-space:nowrap}
.lead{font-size:18px; margin:4px 0 10px}
.lead b{background:linear-gradient(transparent 60%,var(--hl) 60%)}
.prose{margin:6px 0 10px}
.note{font-size:13.5px; color:var(--ink2); margin:6px 0 0}
figure{margin:10px 0 0}
svg{width:100%; height:auto; display:block}
.frame{
  background:var(--card); border:2.5px solid var(--ink); padding:10px 12px;
  border-radius:18px 6px 20px 8px / 8px 20px 6px 18px; box-shadow:5px 5px 0 var(--shadow);
}

/* ---------- SVG 画笔（描边/填充/文字全部走 class，主题切换时跟着变色） ---------- */
.sh{fill:none; stroke:var(--ink); stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}
.thin{stroke-width:1.4} .bold{stroke-width:3.4}
.dash{stroke-dasharray:7 6} .dot{stroke-dasharray:2 6}
.k-ink{stroke:var(--ink)} .k-ink2{stroke:var(--ink2)} .k-green{stroke:var(--green)} .k-orange{stroke:var(--orange)}
.k-blue{stroke:var(--blue)} .k-red{stroke:var(--red)} .k-purple{stroke:var(--purple)} .k-none{stroke:none}
.f-none{fill:none} .f-card{fill:var(--card)} .f-paper{fill:var(--paper)} .f-hl{fill:var(--hl)}
.f-green{fill:var(--green-f)} .f-orange{fill:var(--orange-f)} .f-blue{fill:var(--blue-f)} .f-red{fill:var(--red-f)}
.f-ink{fill:var(--ink2); fill-opacity:.12} .f-purple{fill:var(--purple); fill-opacity:.14}
.fs-ink{fill:var(--ink)} .fs-ink2{fill:var(--ink2)} .fs-green{fill:var(--green)} .fs-orange{fill:var(--orange)}
.fs-blue{fill:var(--blue)} .fs-red{fill:var(--red)} .fs-purple{fill:var(--purple)}
svg text{font-family:var(--sans); fill:var(--ink)}
svg text.b{font-weight:700}
.c-ink{fill:var(--ink)} .c-ink2{fill:var(--ink2)} .c-green{fill:var(--green)} .c-orange{fill:var(--orange)}
.c-blue{fill:var(--blue)} .c-red{fill:var(--red)} .c-purple{fill:var(--purple)}

/* ---------- 体检单 ---------- */
.checkup{list-style:none; margin:10px 0 0; padding:6px 16px}
.checkup li{display:flex; gap:10px; align-items:flex-start; padding:7px 0; border-bottom:1.5px dashed var(--ink2)}
.checkup li:last-child{border-bottom:0}
.checkup svg{width:26px; height:26px; flex:none; margin-top:2px}

/* ---------- 概念卡片 ---------- */
.progress{font:16px var(--hand); margin:14px 0 0; color:var(--ink2)}
.progress b{color:var(--purple); font-size:20px}
.card{
  position:relative; margin:26px 0 0; padding:16px 16px 14px; background:var(--card);
  border:2.5px solid var(--ink); border-radius:18px 6px 20px 8px / 8px 20px 6px 18px;
  box-shadow:5px 5px 0 var(--shadow);
}
.cards .card:nth-of-type(4n+1){transform:rotate(-.55deg)}
.cards .card:nth-of-type(4n+2){transform:rotate(.45deg)}
.cards .card:nth-of-type(4n+3){transform:rotate(-.3deg)}
.cards .card:nth-of-type(4n){transform:rotate(.6deg)}
.card h3{font:700 24px/1.3 var(--hand); margin:0 0 4px; padding-right:96px}  /* 右侧留给印章 */
.card h3 .idx{color:var(--ink2); margin-right:6px}
.card h3 .en{font:15px var(--hand); color:var(--ink2); white-space:nowrap; display:inline-block; margin-left:6px}
.card .def{margin:0 0 4px}
.kv{margin:8px 0 0; padding-left:1.1em; text-indent:-1.1em}
.kv::before{content:"▸ "; color:var(--ink2)}
.kv b{font-family:var(--hand); font-size:18px}
.stamp{
  position:absolute; top:10px; right:12px; transform:rotate(-12deg); cursor:pointer;
  font:700 16px var(--hand); color:var(--purple); background:transparent; letter-spacing:.08em;
  border:3px double var(--purple); border-radius:8px 3px 9px 4px / 4px 9px 3px 8px; padding:2px 10px;
}
.stamp[data-s="1"]{border:2px solid var(--purple)}
.stamp[data-s="0"]{border:2px dashed var(--purple); opacity:.82}
.stamp:hover{transform:rotate(-12deg) scale(1.06)}

/* ---------- 表格 ---------- */
.tblwrap{overflow-x:auto; margin:12px 0 0}
table{border-collapse:collapse; width:100%; font-size:15px; background:var(--card)}
th,td{border:2px solid var(--ink); padding:7px 10px; text-align:left; vertical-align:top}
th{font:700 17px var(--hand); background:var(--hl)}
td.num{white-space:nowrap}

/* ---------- 步骤 / 学习路线 ---------- */
ol.steps{margin:10px 0 0; padding:8px 14px 8px 38px}
ol.steps li{padding:3px 0}
ol.steps li::marker{font:700 18px var(--hand)}
.stops{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin:14px 0 0}
.stop{background:var(--card); border:2.5px solid var(--ink); padding:10px 12px; border-radius:14px 5px 16px 6px / 6px 16px 5px 14px; box-shadow:4px 4px 0 var(--shadow); font-size:14.5px}
.stop h4{font:700 19px var(--hand); margin:0 0 2px}
.stop p{margin:4px 0 0}
.stop .t{color:var(--ink2); font-size:13.5px}

/* ---------- 页脚 ---------- */
footer{margin:46px 0 0; padding-top:14px; border-top:2.5px dashed var(--ink); font-size:14px; color:var(--ink2)}
footer h2{font-size:22px; color:var(--ink)}
footer ol{margin:6px 0 0; padding-left:22px}
footer .disc{margin-top:12px; font-weight:650; color:var(--ink)}
footer .made{margin-top:10px; font:14px var(--hand)}

/* ---------- 自检黑条（?check=1 时显示） ---------- */
#chkbar{position:fixed; left:0; right:0; bottom:0; z-index:99; background:#111; color:#fff; font:12px/1.5 ui-monospace,Menlo,monospace; padding:6px 10px; white-space:pre-wrap; max-height:34vh; overflow:auto}
#chkbar.pass{background:#0b5d2c} #chkbar.fail{background:#8c1d18}

@media (max-width:560px){
  body{font-size:15px}
  .cards .card{transform:none !important}
  .card h3{font-size:21px}
  h2{font-size:24px}
}
@media print{ .theme-btn,#chkbar{display:none} body{background:#fff} .card,.frame,.stop{box-shadow:none} }
</style>
</head>
<body>
<!-- 手绘抖动滤镜：全页只定义一次。只抖图形，不抖文字。 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="wob" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>
<div class="page" id="page">
{{BODY}}
</div>
<script>
/* stock-html runtime：主题切换 · 印章进度 · 版面自检（结果写到 console 和 #stock-html-check） */
(function(){
  var root=document.documentElement, q=new URLSearchParams(location.search), KEY='stock-html:'+{{PAGE_KEY}};
  var L={{LABELS}};
  function store(k,v){try{if(v===undefined)return localStorage.getItem(KEY+k);localStorage.setItem(KEY+k,v)}catch(e){return null}}
  function eff(){return root.getAttribute('data-theme')||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}

  /* ---- 主题 ---- */
  var btn=document.getElementById('themeBtn');
  function paint(){if(btn)btn.textContent=eff()==='dark'?L.toLight:L.toDark}
  var t0=q.get('theme')||store('theme'); if(t0==='dark'||t0==='light')root.setAttribute('data-theme',t0);
  paint();
  if(btn)btn.addEventListener('click',function(){var t=eff()==='dark'?'light':'dark';root.setAttribute('data-theme',t);store('theme',t);paint()});

  /* ---- 印章：点一下切换 下一站 → 补一下 → 已学，自动记住 ---- */
  var stamps=[].slice.call(document.querySelectorAll('.stamp')), prog=document.getElementById('progN');
  function drawStamp(b){b.textContent=L.stamps[+b.getAttribute('data-s')]}
  function count(){if(prog)prog.textContent=stamps.filter(function(b){return b.getAttribute('data-s')==='2'}).length}
  stamps.forEach(function(b,i){
    var s=store('s'+i); if(s==='0'||s==='1'||s==='2')b.setAttribute('data-s',s); drawStamp(b);
    b.addEventListener('click',function(){var n=(+b.getAttribute('data-s')+1)%3;b.setAttribute('data-s',n);store('s'+i,String(n));drawStamp(b);count()});
  }); count();

  /* ---- 截图定位：?at=<小节 id> 把那一节顶到屏幕最上面；?slice=k&sliceh=1300 把页面上移 k 屏，给无头浏览器分段截图用 ---- */
  if(q.has('slice')||q.has('at')){
    var sh=+(q.get('sliceh')||1300), pg=document.getElementById('page'), el=q.get('at')&&document.getElementById(q.get('at'));
    var dy=el?Math.max(0,el.getBoundingClientRect().top+window.scrollY-14):(+q.get('slice')*sh);
    root.style.overflow='hidden'; pg.style.transform='translateY(-'+dy+'px)';
  }

  /* ---- 版面自检 ---- */
  function hit(a,b){return a.x+1<b.x+b.w&&b.x+1<a.x+a.w&&a.y+1<b.y+b.h&&b.y+1<a.y+a.h}
  function runCheck(){
    var capmax=+(root.getAttribute('data-capmax')||15);
    var out={overflow:[],overlap:[],panel:[],caption:[],wobble:[]};
    [].forEach.call(document.querySelectorAll('svg.chk'),function(svg,i){
      var name=svg.getAttribute('data-name')||('svg#'+(i+1)), vb=svg.viewBox.baseVal, boxes=[];
      var panels=[].map.call(svg.querySelectorAll('rect.panel'),function(r){
        return{x:+r.getAttribute('x'),y:+r.getAttribute('y'),w:+r.getAttribute('width'),h:+r.getAttribute('height')}});
      [].forEach.call(svg.querySelectorAll('text'),function(t){
        var s=(t.textContent||'').trim(), r;
        if(t.closest('[filter]'))out.wobble.push(name+' :: '+s);
        try{r=t.getBBox()}catch(e){return}
        if(!r.width)return;
        /* getBBox 的高度是字体行框（≈1.4×字号），上下各收 15% 才接近字形真实占位 */
        var b={x:r.x,y:r.y+r.height*.15,w:r.width,h:r.height*.7,s:s};
        boxes.push(b);
        if(b.x<vb.x||b.y<vb.y||b.x+b.w>vb.x+vb.width||b.y+b.h>vb.y+vb.height)out.overflow.push(name+' :: '+s);
        if(panels.length&&!panels.some(function(p){return b.x>=p.x+3&&b.y>=p.y+3&&b.x+b.w<=p.x+p.w-3&&b.y+b.h<=p.y+p.h-3}))
          out.panel.push(name+' :: '+s);
        if(t.classList.contains('cap')){var n=s.replace(/\s/g,'').length;if(n>capmax)out.caption.push(name+' :: '+s+' ('+n+'>'+capmax+')')}
      });
      for(var a=0;a<boxes.length;a++)for(var c=a+1;c<boxes.length;c++)
        if(hit(boxes[a],boxes[c]))out.overlap.push(name+' :: "'+boxes[a].s+'" × "'+boxes[c].s+'"');
    });
    return out;
  }
  function bad(o){return Object.keys(o).some(function(k){return o[k].length})}
  function checkAll(){
    var keep=root.getAttribute('data-theme'), res={height:document.getElementById('page').scrollHeight,svgs:document.querySelectorAll('svg.chk').length,themes:{}};
    ['light','dark'].forEach(function(t){
      root.setAttribute('data-theme',t); var o=runCheck(), fail=bad(o);
      res.themes[t]={pass:!fail,issues:o};
      console.log('[CHECK '+t+'] '+(fail?'FAIL '+JSON.stringify(o):'PASS'));
    });
    if(keep)root.setAttribute('data-theme',keep);else root.removeAttribute('data-theme');
    res.pass=res.themes.light.pass&&res.themes.dark.pass;
    res.sections={}; [].forEach.call(document.querySelectorAll('#page,section[id],article[id]'),function(e){res.sections[e.id]=Math.ceil(e.getBoundingClientRect().height)});
    root.setAttribute('data-check',res.pass?'PASS':'FAIL');
    var pre=document.createElement('pre'); pre.id='stock-html-check'; pre.hidden=true; pre.textContent=JSON.stringify(res); document.body.appendChild(pre);
    if(q.get('check')==='1'){
      var bar=document.createElement('div'); bar.id='chkbar'; bar.className=res.pass?'pass':'fail';
      bar.textContent='[stock-html check] '+(res.pass?'PASS · ':'FAIL · ')+res.svgs+' svg\n'+(res.pass?'':JSON.stringify(res.themes.light.issues,null,1));
      document.body.appendChild(bar);
    }
    window.__stockHtmlCheck=res; return res;
  }
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(function(){setTimeout(checkAll,60)});
})();
</script>
</body>
</html>
